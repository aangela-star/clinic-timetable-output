<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>門診表產生器 - 結構緩衝優化版</title>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="auth-config.js"></script>
    <script src="auth-gate.js"></script>
    <script src="schedule-api-config.js"></script>
    <script src="schedule-save-load-core.js"></script>
    <script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://unpkg.com/lucide@1.33.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        .poster-content * {
            letter-spacing: 0px !important;
            line-height: 1.2 !important;
            box-sizing: border-box !important;
        }
        /* 優化 iPad 的滾動 */
        .overflow-y-auto { -webkit-overflow-scrolling: touch; }
    </style>

<link rel="stylesheet" href="calendar.css"><style id="paper-rule">@page{size:A4 portrait;margin:10mm}</style>
<script src="calendar-assets.js"></script>
<script src="schedule-core.js"></script>
<script src="timetable-model.js"></script>
<script src="calendar-layout.js"></script>
<script src="timetable-poster.js"></script>
<script src="timetable-view.js"></script>
<script src="calendar-draft.js"></script>
<script src="calendar-meta.js"></script>
<script src="calendar-template.js"></script>
<script src="calendar-editor.js"></script>
</head>
<body class="bg-slate-100 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, forwardRef } = React;

        function LoginScreen({ onLogin }) {
            const [password, setPassword] = useState("");
            const [error, setError] = useState("");
            const [isChecking, setIsChecking] = useState(false);

            const handleSubmit = async (event) => {
                event.preventDefault();
                setIsChecking(true);
                setError("");

                try {
                    const authenticated = await AuthGate.verifyPassword(password);
                    if (authenticated) {
                        setPassword("");
                        onLogin();
                    } else {
                        setError("密碼不正確");
                    }
                } catch (_) {
                    setError("密碼檢查已通過，但伺服器登入失敗。請檢查部署環境或連線，不用重設密碼。");
                } finally {
                    setIsChecking(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-100 flex items-center justify-center p-6">
                    <form onSubmit={handleSubmit} className="w-full max-w-sm bg-white border border-slate-200 shadow-xl rounded-2xl p-6 space-y-4">
                        <h1 className="text-xl font-black text-teal-600">門診表登入</h1>
                        <label className="block text-sm font-black text-slate-500" htmlFor="shared-password">密碼</label>
                        <input
                            id="shared-password"
                            type="password"
                            className="w-full p-3 border-2 border-slate-200 rounded-lg font-bold bg-slate-50 outline-none focus:border-teal-500"
                            value={password}
                            onChange={(event) => setPassword(event.target.value)}
                            autoComplete="current-password"
                            autoFocus
                        />
                        {error && <div className="text-sm font-bold text-rose-600">{error}</div>}
                        <button disabled={isChecking} className={`w-full py-3 rounded-xl font-black text-white ${isChecking ? 'bg-slate-400' : 'bg-teal-600 active:scale-95'}`}>
                            {isChecking ? '驗證中...' : '登入'}
                        </button>
                    </form>
                </div>
            );
        }

        function CalendarApp({onLogout,onCloudLogin,preview=false}) {
            const host=useRef(null);
            useEffect(()=>{ host.current.innerHTML=window.CalendarMarkup; return window.startCalendarEditor({preview}); },[preview]);
            return <><nav id="calendar-toolbar" style={{padding:16,background:'#fff'}}><a href="https://clinic-system-portal.vercel.app/">診所工具總入口</a>　<a href="legacy.html" target="_blank" rel="noopener">舊版資料編輯／PNG</a>　{preview && <button onClick={()=>{if(window.calendarCanLeave?.())onCloudLogin()}}>雲端登入（跨設備儲存／載入）</button>}　{!preview && <button onClick={()=>{if(window.calendarCanLeave?.())onLogout()}}>登出</button>}</nav><div ref={host}/></>;
        }
        function AuthenticatedApp() {
            const [editorMode,setEditorMode]=useState(null);
            const [cloudLogin,setCloudLogin]=useState(false);
            useEffect(()=>{let active=true;fetch('/api/editor-mode',{credentials:'same-origin',cache:'no-store'}).then(r=>r.ok?r.json():{}).then(m=>{if(active)setEditorMode(m.preview===true)}).catch(()=>{if(active)setEditorMode(false)});return()=>{active=false}},[]);
            const [authenticated, setAuthenticated] = useState(AuthGate.isAuthenticated());

            useEffect(() => {
                if (authenticated) {
                    setTimeout(() => lucide.createIcons(), 0);
                }
            }, [authenticated]);

            const handleLogout = () => {
                AuthGate.logout();
                setAuthenticated(false);
            };

            if(editorMode===null)return <p style={{padding:24}}>正在開啟門診表…</p>;
            if(cloudLogin&&!authenticated)return <><button style={{margin:16}} onClick={()=>setCloudLogin(false)}>返回本機編輯</button><LoginScreen onLogin={()=>{setAuthenticated(true);setCloudLogin(false)}}/></>;
            if(editorMode===true&&!authenticated)return <CalendarApp preview={true} onCloudLogin={()=>setCloudLogin(true)}/>;
            return authenticated ? <CalendarApp onLogout={handleLogout} /> : <LoginScreen onLogin={() => setAuthenticated(true)} />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AuthenticatedApp />);
        setTimeout(() => lucide.createIcons(), 500);
    </script>
</body>
</html>
