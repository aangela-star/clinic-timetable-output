<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>門診表產生器 - 結構緩衝優化版</title>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="auth-config.js"></script>
    <script src="auth-gate.js"></script>
    <script src="schedule-api-config.js"></script>
    <script src="schedule-save-load-core.js"></script>
    <script src="clinic-order.js"></script>
    <script src="publish-core.js"></script>
    <script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://unpkg.com/lucide@1.33.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        .poster-content * { 
            letter-spacing: 0px !important; 
            line-height: 1.2 !important; 
            box-sizing: border-box !important;
        }
        /* 優化 iPad 的滾動 */
        .overflow-y-auto { -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, forwardRef } = React;

        const DAYS = ["週一", "週二", "週三", "週四", "週五", "週六"];
        const SLOTS = [
            { key: "早診", label: "早\n8:30~11:30" },
            { key: "午診", label: "中\n14:30~17:30" },
            { key: "晚診", label: "晚\n18:30~20:30" },
        ];

        const DOCTOR_COLORS = {
            "劉晉瑋": "#d91e18", "莊逸玟": "#2244cc", "王文達": "#27ae60",
            "薛琇方": "#d35400", "蔡玉麟": "#27ae60",
            "劉": "#d91e18", "莊": "#2244cc", "王": "#27ae60", "薛": "#d35400", "蔡": "#27ae60",
            "輪班": "#000000", "(輪班)": "#000000", "預設": "#475569"
        };

        const INITIAL_DATA = {
            title: "115/4月", 
            note: "● 黑點表示當時段無醫師看診 ps. 如有需掛號請記得提早五分鐘到診所喔！",
            clinics: [
                {
                    id: "clinic-1",
                    name: "晉安復健科診所 醫師門診表",
                    theme: "teal",
                    changes: ["4/5 (六) 早 劉 / 午 莊 / 晚 薛"],
                    schedule: {
                        "週一": { "早診": "劉晉瑋", "午診": "莊逸玟", "晚診": "劉晉瑋" },
                        "週二": { "早診": "莊逸玟", "午診": "劉晉瑋", "晚診": "薛琇方" },
                        "週三": { "早診": "薛琇方", "午診": "莊逸玟", "晚診": "王文達" },
                        "週四": { "早診": "莊逸玟", "午診": "王文達", "晚診": "王文達" },
                        "週五": { "早診": "劉晉瑋", "午診": "劉晉瑋", "晚診": "莊逸玟" },
                        "週六": { "早診": "(輪班)", "午診": "休", "晚診": "休" },
                    }
                },
                {
                    id: "clinic-2",
                    name: "毅安診所 醫師門診表",
                    theme: "blue",
                    changes: ["4/5 (六) 早 劉 / 午 莊 / 晚 薛"],
                    schedule: {
                        "週一": { "早診": "薛琇方", "午診": "劉晉瑋", "晚診": "莊逸玟" },
                        "週二": { "早診": "薛琇方", "午診": "王文達", "晚診": "王文達" },
                        "週三": { "早診": "劉晉瑋", "午診": "王文達", "晚診": "莊逸玟" },
                        "週四": { "早診": "劉晉瑋", "午診": "蔡玉麟", "晚診": "蔡玉麟" },
                        "週五": { "早診": "薛琇方", "午診": "莊逸玟", "晚診": "劉晉瑋" },
                        "週六": { "早診": "(輪班)", "午診": "休", "晚診": "休" },
                    }
                }
            ]
        };

        const PosterContent = forwardRef(({ data, isForCapture }, ref) => (
            <main 
                ref={ref}
                style={{
                    width: '1080px', height: '1920px', padding: '60px 80px',
                    background: '#f8fafc', display: 'flex', flexDirection: 'column',
                    boxSizing: 'border-box', borderRadius: isForCapture ? '0' : '24px',
                    boxShadow: isForCapture ? 'none' : '0 20px 60px rgba(0,0,0,0.15)',
                    position: isForCapture ? 'absolute' : 'relative',
                    left: isForCapture ? '-9999px' : '0', top: isForCapture ? '-9999px' : '0',
                    gap: '40px'
                }}
            >
                <div style={{ display: 'flex', flexDirection: 'column', gap: '30px' }}>
                    {data.clinics.map((clinic, cIdx) => (
                        <section key={cIdx} style={{ 
                            background: '#ffffff', borderRadius: '50px', padding: '40px 40px',
                            boxShadow: '0 8px 30px rgba(0,0,0,0.03)', border: '1px solid #edf2f7',
                            display: 'flex', flexDirection: 'column', gap: '20px'
                        }}>
                            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '20px' }}>
                                <span style={{ fontSize: '38px', fontWeight: 700, color: '#4a5568' }}>{data.title}</span>
                                <span style={{ fontSize: '50px', fontWeight: 800, color: clinic.theme === 'teal' ? '#2c7a7b' : '#2b6cb0' }}>
                                    {clinic.name}
                                </span>
                            </div>

                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '10px' }}>
                                <div style={{ height: '70px' }}></div>
                                {DAYS.map(d => (
                                    <div key={d} style={{ 
                                        background: clinic.theme === 'teal' ? '#5f8cb3' : '#e07a7a', 
                                        color: 'white', borderRadius: '20px', height: '70px',
                                        fontSize: '28px', fontWeight: 800, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center'
                                    }}>
                                        <span style={{ transform: 'translateY(2px)' }}>{d.replace('週', '')}</span>
                                        {/* 物理性空白層：控制在 8px */}
                                        <div style={{ height: '8px' }}></div>
                                    </div>
                                ))}

                                {SLOTS.map(s => (
                                    <React.Fragment key={s.key}>
                                        <div style={{ height: '110px', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
                                            <div style={{ background: '#e9d8a6', width: '64px', height: '64px', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '24px', fontWeight: 800, color: '#5d4037' }}>
                                                {s.label.split('\n')[0]}
                                            </div>
                                            <div style={{ fontSize: '16px', fontWeight: 700, color: '#64748b', marginTop: '6px' }}>{s.label.split('\n')[1]}</div>
                                        </div>
                                        {DAYS.map(d => {
                                            const doc = clinic.schedule[d]?.[s.key] || "●";
                                            const color = DOCTOR_COLORS[doc] || DOCTOR_COLORS["預設"];
                                            return (
                                                <div key={d} style={{ 
                                                    border: '3px solid #334155', borderRadius: '25px', 
                                                    height: '110px', display: 'flex', alignItems: 'center', justifyContent: 'center'
                                                }}>
                                                    <div style={{ fontSize: '32px', fontWeight: 800, color: doc === "●" || doc === "休" ? "#cbd5e1" : color, transform: 'translateY(-1px)' }}>
                                                        {doc}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </React.Fragment>
                                ))}
                            </div>

                            {/* 門診異動區塊：優化頂部高度與間距 */}
                            {clinic.changes && clinic.changes.length > 0 && (
                                <div style={{ 
                                    background: '#f1f5f9', borderRadius: '28px', padding: '12px 40px 25px 40px', 
                                    borderLeft: `14px solid ${clinic.theme === 'teal' ? '#2c7a7b' : '#2b6cb0'}`,
                                    marginTop: '5px'
                                }}>
                                    <div style={{ fontSize: '26px', fontWeight: 800, color: '#334155', marginBottom: '8px', display: 'flex', alignItems: 'center', gap: '12px' }}>
                                        <span style={{ color: '#f59e0b' }}>🔺</span> 門診異動
                                    </div>
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                                        {clinic.changes.map((item, i) => (
                                            <div key={i} style={{ fontSize: '24px', fontWeight: 700, color: '#475569', display: 'flex', alignItems: 'baseline', gap: '12px' }}>
                                                <span style={{ color: '#94a3b8' }}>•</span>
                                                <span>{item}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </section>
                    ))}
                </div>

                <footer style={{ marginTop: 'auto', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '30px', paddingBottom: '20px' }}>
                    <div style={{ padding: '25px 40px', background: '#e2e8f0', borderRadius: '40px', width: '100%' }}>
                        <div style={{ fontSize: '20px', fontWeight: 700, color: '#334155', textAlign: 'center', lineHeight: 1.6 }}>{data.note}</div>
                    </div>
                    <div style={{ textAlign: 'center' }}>
                        <div style={{ fontSize: '38px', fontWeight: 800, color: '#1a365d', letterSpacing: '2px' }}>
                            晉安 / 毅安 <span style={{ fontWeight: 400, color: '#4a5568', margin: '0 10px' }}>|</span> <span style={{ color: '#2c7a7b', fontSize: '34px' }}>專業復健體系</span>
                        </div>
                        <div style={{ fontSize: '20px', fontWeight: 700, color: '#94a3b8', marginTop: '8px' }}>Tainan Rehab Medical Group</div>
                    </div>
                </footer>
            </main>
        ));

        function App({ onLogout }) {
            const [data, setData] = useState(INITIAL_DATA);
            const [isCapturing, setIsCapturing] = useState(false);
            const [monthKey, setMonthKey] = useState(() => ScheduleSaveLoadCore.getInitialMonthKey(window, INITIAL_DATA.title));
            const [isLoadingSchedule, setIsLoadingSchedule] = useState(false);
            const [isSavingSchedule, setIsSavingSchedule] = useState(false);
            const [scheduleStatus, setScheduleStatus] = useState("");
            const [primaryClinicId, setPrimaryClinicId] = useState(() => INITIAL_DATA.clinics[0].id);
            const [isPublishDialogOpen, setIsPublishDialogOpen] = useState(false);
            const [selectedPublishChannelIds, setSelectedPublishChannelIds] = useState([]);
            const [publishStatus, setPublishStatus] = useState("");
            const captureRef = useRef(null);
            const publishButtonRef = useRef(null);
            const publishDialogRef = useRef(null);
            const renderData = { ...data, clinics: ClinicOrder.orderClinicsByPriority(data.clinics, primaryClinicId) };
            const publishReadiness = PublishCore.evaluatePublishSelection(PublishCore.PUBLISH_CHANNELS, selectedPublishChannelIds, primaryClinicId);
            const primaryClinicGuard = PublishCore.evaluatePublishSelection(PublishCore.PUBLISH_CHANNELS, PublishCore.PUBLISH_CHANNELS.map((channel) => channel.id), primaryClinicId);

            const updateClinicSchedule = (cIdx, day, slot, value) => {
                const newData = JSON.parse(JSON.stringify(data));
                newData.clinics[cIdx].schedule[day][slot] = value;
                setData(newData);
            };

            const getScheduleApiUrl = () => String(window.SCHEDULE_SAVE_LOAD_CONFIG?.webAppUrl || "").trim();

            const handleLoadSchedule = async () => {
                if (!ScheduleSaveLoadCore.isValidMonthKey(monthKey)) {
                    setScheduleStatus("請先選擇正確月份（YYYY-MM）。");
                    return;
                }

                const apiUrl = getScheduleApiUrl();
                if (!apiUrl) {
                    setScheduleStatus("Save / Load 尚未連接 Apps Script Web App。");
                    return;
                }

                setIsLoadingSchedule(true);
                setScheduleStatus("正在載入本月門診...");
                try {
                    const url = new URL(apiUrl);
                    url.searchParams.set("action", "load");
                    url.searchParams.set("month", monthKey);
                    const response = await fetch(url.toString(), { method: "GET", redirect: "follow" });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const payload = await response.json();
                    if (!payload.ok) throw new Error(payload.message || payload.error || "載入失敗");
                    if (!payload.found) {
                        setScheduleStatus(`「${monthKey}」尚無已儲存資料，目前畫面未變更。`);
                        return;
                    }
                    if (!ScheduleSaveLoadCore.isValidScheduleData(payload.data)) {
                        throw new Error("已儲存的門診資料格式不完整，為避免覆寫目前畫面已停止載入。");
                    }
                    const mismatch = ScheduleSaveLoadCore.getMonthTitleMismatch(monthKey, payload.data.title);
                    if (mismatch) throw new Error(mismatch.message);

                    setData(payload.data);
                    ScheduleSaveLoadCore.rememberLoadedMonth(window, monthKey, payload);
                    setScheduleStatus(`已載入 ${monthKey} 門診資料。`);
                    setTimeout(() => lucide.createIcons(), 0);
                } catch (err) {
                    console.error("載入門診失敗:", err);
                    setScheduleStatus(`載入失敗，目前畫面未變更：${err.message || err}`);
                } finally {
                    setIsLoadingSchedule(false);
                }
            };

            const handleSaveSchedule = async () => {
                if (!ScheduleSaveLoadCore.isValidScheduleData(data)) {
                    setScheduleStatus("門診資料格式不完整，已停止儲存。");
                    return;
                }

                const mismatch = ScheduleSaveLoadCore.getMonthTitleMismatch(monthKey, data.title);
                if (mismatch) {
                    setScheduleStatus(mismatch.message);
                    return;
                }

                const apiUrl = getScheduleApiUrl();
                if (!apiUrl) {
                    setScheduleStatus("Save / Load 尚未連接 Apps Script Web App。");
                    return;
                }

                setIsSavingSchedule(true);
                setScheduleStatus("正在儲存本月門診...");
                try {
                    const response = await fetch(apiUrl, {
                        method: "POST",
                        redirect: "follow",
                        headers: { "Content-Type": "text/plain;charset=UTF-8" },
                        body: JSON.stringify({
                            action: "save",
                            month: monthKey,
                            schemaVersion: 1,
                            data,
                        }),
                    });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const payload = await response.json();
                    if (!payload.ok) throw new Error(payload.message || payload.error || "儲存失敗");
                    ScheduleSaveLoadCore.rememberSavedMonth(window, monthKey, payload);
                    const savedTime = payload.updatedAt ? new Date(payload.updatedAt).toLocaleString("zh-TW") : "剛剛";
                    setScheduleStatus(`已儲存 ${monthKey} 門診資料（${savedTime}）。`);
                } catch (err) {
                    console.error("儲存門診失敗:", err);
                    setScheduleStatus(`儲存失敗，目前畫面未變更：${err.message || err}`);
                } finally {
                    setIsSavingSchedule(false);
                }
            };

            const handleDownload = async () => {
                if (!captureRef.current) return;
                setIsCapturing(true);
                await document.fonts.ready;
                
                setTimeout(async () => {
                    try {
                        const canvas = await html2canvas(captureRef.current, {
                            scale: 2, useCORS: true, backgroundColor: "#f8fafc", width: 1080, height: 1920
                        });
                        const link = document.createElement('a');
                        link.download = `${data.title.replace('/', '-')}_醫師門診表.png`;
                        link.href = canvas.toDataURL("image/png", 1.0);
                        link.click();
                    } catch (err) {
                        console.error("下載失敗:", err);
                    } finally {
                        setIsCapturing(false);
                    }
                }, 500);
            };

            const handleOpenPublish = () => {
                setSelectedPublishChannelIds([]);
                setPublishStatus("");
                setIsPublishDialogOpen(true);
            };

            const togglePublishChannel = (channelId) => {
                setSelectedPublishChannelIds((currentIds) =>
                    currentIds.includes(channelId)
                        ? currentIds.filter((id) => id !== channelId)
                        : [...currentIds, channelId]
                );
                setPublishStatus("");
            };

            const handleConfirmPublish = () => {
                if (!publishReadiness.canConfirm) return;
                setPublishStatus("晉安官網串接尚未啟用");
            };

            useEffect(() => {
                if (!isPublishDialogOpen) return;

                const dialog = publishDialogRef.current;
                if (!dialog) return;

                const getFocusableElements = () => Array.from(
                    dialog.querySelectorAll('button:not(:disabled), input:not(:disabled)')
                );
                const channelCheckbox = getFocusableElements().find((element) => element.type === "checkbox");
                const firstFocusable = getFocusableElements()[0];
                (channelCheckbox || firstFocusable || dialog).focus();

                const handleKeyDown = (event) => {
                    if (event.key === "Escape") {
                        event.preventDefault();
                        setIsPublishDialogOpen(false);
                        return;
                    }

                    if (event.key !== "Tab") return;

                    const focusableElements = getFocusableElements();
                    if (!focusableElements.length) {
                        event.preventDefault();
                        dialog.focus();
                        return;
                    }

                    const firstFocusable = focusableElements[0];
                    const lastFocusable = focusableElements[focusableElements.length - 1];
                    const isShiftTab = event.shiftKey;

                    if (!dialog.contains(document.activeElement)) {
                        event.preventDefault();
                        (isShiftTab ? lastFocusable : firstFocusable).focus();
                        return;
                    }

                    if (isShiftTab && document.activeElement === firstFocusable) {
                        event.preventDefault();
                        lastFocusable.focus();
                    } else if (!isShiftTab && document.activeElement === lastFocusable) {
                        event.preventDefault();
                        firstFocusable.focus();
                    }
                };

                document.addEventListener("keydown", handleKeyDown);
                return () => {
                    document.removeEventListener("keydown", handleKeyDown);
                    publishButtonRef.current?.focus();
                };
            }, [isPublishDialogOpen]);

            return (
                <div className="flex flex-col lg:flex-row min-h-screen bg-slate-100 text-slate-900">
                    <PosterContent ref={captureRef} data={renderData} isForCapture={true} />
                    
                    <div className="w-full lg:w-[450px] p-6 bg-white shadow-2xl overflow-y-auto max-h-screen border-r z-10 text-slate-800">
                        <header className="mb-6 pb-4 border-b flex items-center justify-between gap-4">
                            <h1 className="text-2xl font-black text-teal-600 flex items-center gap-2">
                                <i data-lucide="edit-3"></i> 門診表智慧編輯
                            </h1>
                            <button onClick={onLogout} className="px-3 py-2 rounded-lg border border-slate-200 text-sm font-black text-slate-500 hover:bg-slate-50">
                                登出
                            </button>
                        </header>

                        <div className="space-y-6">
                            <section className="space-y-2">
                                <label className="block text-sm font-black text-slate-500">存檔月份</label>
                                <input
                                    type="month"
                                    className="w-full p-2 border-2 border-slate-200 rounded-lg font-bold bg-slate-50 outline-none"
                                    value={monthKey}
                                    onChange={(e) => {
                                        setMonthKey(e.target.value);
                                        setScheduleStatus("");
                                    }}
                                />
                                <div className="grid grid-cols-2 gap-2">
                                    <button
                                        type="button"
                                        onClick={handleLoadSchedule}
                                        disabled={isLoadingSchedule || isSavingSchedule}
                                        className="py-2 px-3 rounded-lg border-2 border-teal-600 text-teal-700 text-sm font-black disabled:opacity-50"
                                    >
                                        {isLoadingSchedule ? "載入中..." : "載入本月門診"}
                                    </button>
                                    <button
                                        type="button"
                                        onClick={handleSaveSchedule}
                                        disabled={isLoadingSchedule || isSavingSchedule}
                                        className="py-2 px-3 rounded-lg bg-teal-600 text-white text-sm font-black disabled:opacity-50"
                                    >
                                        {isSavingSchedule ? "儲存中..." : "儲存本月門診"}
                                    </button>
                                </div>
                                {scheduleStatus && <div className="text-xs font-bold text-slate-600 leading-relaxed">{scheduleStatus}</div>}
                            </section>

                            <section>
                                <label className="block text-sm font-black text-slate-500 mb-1">年份月份</label>
                                <input className="w-full p-2 border-2 border-slate-200 rounded-lg font-bold bg-slate-50 outline-none" value={data.title} onChange={(e) => setData({...data, title: e.target.value})} />
                            </section>

                            <section>
                                <label className="block text-sm font-black text-slate-500 mb-1">主院所</label>
                                <select className="w-full p-2 border-2 border-slate-200 rounded-lg font-bold bg-slate-50 outline-none" value={primaryClinicId} onChange={(e) => setPrimaryClinicId(e.target.value)}>
                                    <option value="clinic-1">晉安優先</option>
                                    <option value="clinic-2">毅安優先</option>
                                </select>
                            </section>

                            {data.clinics.map((clinic, cIdx) => (
                                <section key={cIdx} className="p-4 bg-slate-50 rounded-2xl border-2 border-slate-100 space-y-4">
                                    <div className="font-bold text-lg border-b pb-1 text-slate-700">{cIdx === 0 ? "晉安院區" : "毅安院區"}</div>
                                    <div className="grid grid-cols-7 gap-1">
                                        <div className="text-[10px] text-center font-bold text-slate-400">時段</div>
                                        {DAYS.map(d => <div key={d} className="text-[10px] text-center font-bold text-slate-400">{d}</div>)}
                                        {SLOTS.map(s => (
                                            <React.Fragment key={s.key}>
                                                <div className="text-[10px] flex items-center justify-center bg-slate-200 rounded py-1">{s.key.charAt(0)}</div>
                                                {DAYS.map(d => (
                                                    <input key={d} className="w-full p-1 text-center border rounded text-[12px] bg-white outline-none" value={clinic.schedule[d]?.[s.key] || "●"} onChange={(e) => updateClinicSchedule(cIdx, d, s.key, e.target.value)} />
                                                ))}
                                            </React.Fragment>
                                        ))}
                                    </div>
                                    
                                    <div className="border-t pt-3">
                                        <div className="flex justify-between items-center mb-2 text-sm font-black">
                                            <span>門診異動</span>
                                            <button onClick={() => { const n = {...data}; n.clinics[cIdx].changes.push(""); setData(n); }} className="p-1 bg-teal-600 text-white rounded"><i data-lucide="plus" className="w-4 h-4"></i></button>
                                        </div>
                                        {/* 已有異動清單 */}
                                        {clinic.changes.map((item, idx) => (
                                            <div key={idx} className="flex gap-2 mb-2">
                                                <input className="flex-1 p-2 border rounded-lg text-xs bg-white outline-none" value={item} onChange={(e) => {
                                                    const n = JSON.parse(JSON.stringify(data));
                                                    n.clinics[cIdx].changes[idx] = e.target.value;
                                                    setData(n);
                                                }} />
                                                <button onClick={() => { const n = JSON.parse(JSON.stringify(data)); n.clinics[cIdx].changes.splice(idx,1); setData(n); }} className="text-rose-500 hover:bg-rose-50 p-1 rounded"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                            </div>
                                        ))}
                                        {/* 永遠顯示最後一行空白輸入框 */}
                                        <div className="flex gap-2 mb-2 opacity-60">
                                            <input 
                                                className="flex-1 p-2 border border-dashed rounded-lg text-xs bg-white outline-none focus:border-solid focus:opacity-100 transition-all" 
                                                placeholder="在此輸入新增異動..."
                                                onBlur={(e) => {
                                                    if(e.target.value.trim() !== "") {
                                                        const n = JSON.parse(JSON.stringify(data));
                                                        n.clinics[cIdx].changes.push(e.target.value);
                                                        setData(n);
                                                        e.target.value = ""; 
                                                    }
                                                }}
                                                onKeyDown={(e) => {
                                                    if(e.key === 'Enter' && e.target.value.trim() !== "") {
                                                        const n = JSON.parse(JSON.stringify(data));
                                                        n.clinics[cIdx].changes.push(e.target.value);
                                                        setData(n);
                                                        e.target.value = "";
                                                    }
                                                }}
                                            />
                                            <div className="w-6"></div>
                                        </div>
                                    </div>
                                </section>
                            ))}

                            <section>
                                <label className="block text-sm font-black text-slate-500 mb-1">底部備註</label>
                                <textarea className="w-full p-2 border-2 border-slate-200 rounded-lg text-sm h-20 bg-slate-50 outline-none" value={data.note} onChange={(e) => setData({...data, note: e.target.value})} />
                            </section>

                            <button onClick={handleDownload} disabled={isCapturing} className={`w-full py-4 rounded-2xl font-black text-white flex items-center justify-center gap-2 shadow-lg transition-all ${isCapturing ? 'bg-slate-400' : 'bg-teal-600 active:scale-95'}`}>
                                <i data-lucide="download"></i> {isCapturing ? '正在產生圖片...' : '下載高清 PNG 海報'}
                            </button>
                            <button ref={publishButtonRef} onClick={handleOpenPublish} className="w-full py-4 rounded-2xl font-black text-white flex items-center justify-center gap-2 shadow-lg transition-all bg-slate-700 active:scale-95">
                                <i data-lucide="send"></i> 發布
                            </button>
                        </div>
                    </div>

                    <div className="flex-1 flex justify-center items-start p-6 overflow-auto bg-slate-300">
                        <div className="scale-[0.25] md:scale-[0.35] lg:scale-[0.3] xl:scale-[0.4] origin-top my-4 shadow-2xl">
                            <PosterContent data={renderData} isForCapture={false} />
                        </div>
                    </div>
                    {isPublishDialogOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4">
                            <div ref={publishDialogRef} role="dialog" aria-modal="true" aria-labelledby="publish-dialog-title" tabIndex="-1" className="w-full max-w-sm rounded-xl bg-white p-5 shadow-2xl border border-slate-200 space-y-4">
                                <div className="flex items-start justify-between gap-3">
                                    <h2 id="publish-dialog-title" className="text-lg font-black text-slate-800">發布確認</h2>
                                    <button type="button" onClick={() => setIsPublishDialogOpen(false)} className="p-2 rounded-lg text-slate-500 hover:bg-slate-100" aria-label="關閉發布確認">
                                        <span aria-hidden="true">×</span>
                                    </button>
                                </div>

                                {primaryClinicGuard.warning && (
                                    <div role="alert" className="rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-sm font-black text-amber-800">
                                        {primaryClinicGuard.warning}
                                    </div>
                                )}

                                <div className="space-y-2 text-sm">
                                    <div className="flex justify-between gap-3">
                                        <span className="font-black text-slate-500">主院所排序</span>
                                        <span className="font-bold text-slate-800">{primaryClinicId === "clinic-1" ? "晉安優先" : "毅安優先"}</span>
                                    </div>
                                    <div className="flex justify-between gap-3">
                                        <span className="font-black text-slate-500">門診月份／標題</span>
                                        <span className="font-bold text-slate-800">{data.title}</span>
                                    </div>
                                    <div className="flex justify-between gap-3">
                                        <span className="font-black text-slate-500">圖片來源</span>
                                        <span className="font-bold text-slate-800">目前 Preview 對應的 PNG</span>
                                    </div>
                                </div>

                                <div className="space-y-2">
                                    {PublishCore.PUBLISH_CHANNELS.map((channel) => (
                                        <label key={channel.id} className="flex items-center gap-3 rounded-lg border border-slate-200 p-3 text-sm font-black text-slate-700">
                                            <input
                                                type="checkbox"
                                                checked={selectedPublishChannelIds.includes(channel.id)}
                                                onChange={() => togglePublishChannel(channel.id)}
                                                className="h-4 w-4"
                                            />
                                            <span>{channel.label}</span>
                                        </label>
                                    ))}
                                </div>

                                {publishStatus && (
                                    <div role="status" aria-live="polite" className="text-sm font-black text-slate-700">{publishStatus}</div>
                                )}

                                <div className="grid grid-cols-2 gap-2">
                                    <button type="button" onClick={() => setIsPublishDialogOpen(false)} className="py-2 px-3 rounded-lg border-2 border-slate-200 text-slate-600 text-sm font-black">
                                        取消
                                    </button>
                                    <button type="button" onClick={handleConfirmPublish} disabled={!publishReadiness.canConfirm} className="py-2 px-3 rounded-lg bg-teal-600 text-white text-sm font-black disabled:opacity-50">
                                        確認發布
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function LoginScreen({ onLogin }) {
            const [password, setPassword] = useState("");
            const [error, setError] = useState("");
            const [isChecking, setIsChecking] = useState(false);

            const handleSubmit = async (event) => {
                event.preventDefault();
                setIsChecking(true);
                setError("");

                try {
                    const authenticated = await AuthGate.verifyPassword(password);
                    if (authenticated) {
                        setPassword("");
                        onLogin();
                    } else {
                        setError("密碼不正確");
                    }
                } finally {
                    setIsChecking(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-100 flex items-center justify-center p-6">
                    <form onSubmit={handleSubmit} className="w-full max-w-sm bg-white border border-slate-200 shadow-xl rounded-2xl p-6 space-y-4">
                        <h1 className="text-xl font-black text-teal-600">門診表登入</h1>
                        <label className="block text-sm font-black text-slate-500" htmlFor="shared-password">密碼</label>
                        <input
                            id="shared-password"
                            type="password"
                            className="w-full p-3 border-2 border-slate-200 rounded-lg font-bold bg-slate-50 outline-none focus:border-teal-500"
                            value={password}
                            onChange={(event) => setPassword(event.target.value)}
                            autoComplete="current-password"
                            autoFocus
                        />
                        {error && <div className="text-sm font-bold text-rose-600">{error}</div>}
                        <button disabled={isChecking} className={`w-full py-3 rounded-xl font-black text-white ${isChecking ? 'bg-slate-400' : 'bg-teal-600 active:scale-95'}`}>
                            {isChecking ? '驗證中...' : '登入'}
                        </button>
                    </form>
                </div>
            );
        }

        function AuthenticatedApp() {
            const [authenticated, setAuthenticated] = useState(AuthGate.isAuthenticated());

            useEffect(() => {
                if (authenticated) {
                    setTimeout(() => lucide.createIcons(), 0);
                }
            }, [authenticated]);

            const handleLogout = () => {
                AuthGate.logout();
                setAuthenticated(false);
            };

            return authenticated ? <App onLogout={handleLogout} /> : <LoginScreen onLogin={() => setAuthenticated(true)} />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AuthenticatedApp />);
        setTimeout(() => lucide.createIcons(), 500);
    </script>
</body>
</html>
